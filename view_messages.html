<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saqib Afridi | Contact Messages Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1a;
            color: #e2e8f0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e2a3a;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        h1 i {
            margin-right: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .stat-badge i {
            margin-right: 8px;
            color: #3b82f6;
        }

        .stat-badge span {
            font-weight: bold;
            color: #60a5fa;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
        }

        .btn-refresh:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-delete-all {
            background: #dc2626;
            color: white;
        }

        .btn-delete-all:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .btn-export {
            background: #10b981;
            color: white;
        }

        .btn-export:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        /* Search */
        .search-box {
            margin-bottom: 24px;
        }

        .search-box input {
            width: 100%;
            max-width: 300px;
            padding: 10px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 40px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        /* Messages Grid */
        .messages-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-card {
            background: #111827;
            border-radius: 20px;
            border: 1px solid #1f2a3e;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            border-color: #3b82f6;
            transform: translateX(4px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .message-sender {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sender-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .sender-info h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sender-info .sender-email {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .message-meta {
            text-align: right;
        }

        .message-date {
            font-size: 0.7rem;
            color: #64748b;
        }

        .message-subject {
            font-size: 0.75rem;
            color: #fbbf24;
            margin-top: 4px;
        }

        .message-body {
            padding: 20px;
            line-height: 1.6;
            font-size: 0.9rem;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-actions {
            padding: 12px 20px;
            border-top: 1px solid #1f2a3e;
            display: flex;
            gap: 16px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: #3b82f6;
        }

        .action-btn.delete:hover {
            color: #ef4444;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: #111827;
            border-radius: 24px;
            border: 1px solid #1f2a3e;
        }

        .empty-state i {
            font-size: 4rem;
            color: #3b82f6;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #64748b;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: #1e293b;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            border: 1px solid #334155;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        .modal-body {
            padding: 24px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #1f2a3e;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .message-header {
                flex-direction: column;
                text-align: center;
            }
            .message-meta {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-envelope"></i> Contact Messages</h1>
            <div class="stats">
                <div class="stat-badge"><i class="fas fa-envelope"></i> Total: <span id="totalCount">0</span></div>
                <div class="stat-badge"><i class="fas fa-eye"></i> Storage: <span id="storageInfo">localStorage</span></div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-refresh" onclick="loadMessages()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn btn-export" onclick="exportMessages()"><i class="fas fa-download"></i> Export JSON</button>
            <button class="btn btn-delete-all" onclick="deleteAllMessages()"><i class="fas fa-trash-alt"></i> Delete All</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search by name, email, subject or message..." onkeyup="filterMessages()">
        </div>

        <div id="messagesContainer" class="messages-grid">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>No messages yet</h3>
                <p>Messages from the contact form will appear here.</p>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-lock"></i> Messages are stored locally in your browser. No data is sent to any server.
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div id="messageModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Message Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let allMessages = [];

        function loadMessages() {
            const stored = localStorage.getItem('contact_messages');
            if (stored) {
                try {
                    allMessages = JSON.parse(stored);
                } catch(e) {
                    allMessages = [];
                }
            } else {
                allMessages = [];
            }
            
            document.getElementById('totalCount').textContent = allMessages.length;
            renderMessages(allMessages);
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No messages found</h3>
                        <p>${allMessages.length === 0 ? 'No messages yet. Submit a message from the contact form!' : 'No messages match your search.'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = messages.map(msg => `
                <div class="message-card" data-id="${msg.id}">
                    <div class="message-header">
                        <div class="message-sender">
                            <div class="sender-avatar">${getInitials(msg.name)}</div>
                            <div class="sender-info">
                                <h4>${escapeHtml(msg.name)}</h4>
                                <div class="sender-email">${escapeHtml(msg.email)}</div>
                            </div>
                        </div>
                        <div class="message-meta">
                            <div class="message-date">${msg.date || 'Unknown date'}</div>
                            <div class="message-subject"><i class="fas fa-tag"></i> ${escapeHtml(msg.subject || 'No subject')}</div>
                        </div>
                    </div>
                    <div class="message-body">
                        ${truncateText(escapeHtml(msg.message || ''), 200)}
                    </div>
                    <div class="message-actions">
                        <button class="action-btn" onclick="viewMessage(${msg.id})"><i class="fas fa-eye"></i> View Full</button>
                        <button class="action-btn delete" onclick="deleteMessage(${msg.id})"><i class="fas fa-trash"></i> Delete</button>
                        <button class="action-btn" onclick="copyMessage(${msg.id})"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                </div>
            `).join('');
        }

        function filterMessages() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (!searchTerm) {
                renderMessages(allMessages);
                return;
            }
            
            const filtered = allMessages.filter(msg => 
                msg.name.toLowerCase().includes(searchTerm) ||
                msg.email.toLowerCase().includes(searchTerm) ||
                (msg.subject && msg.subject.toLowerCase().includes(searchTerm)) ||
                (msg.message && msg.message.toLowerCase().includes(searchTerm))
            );
            renderMessages(filtered);
        }

        function viewMessage(id) {
            const message = allMessages.find(m => m.id === id);
            if (!message) return;
            
            document.getElementById('modalTitle').innerHTML = `<i class="fas fa-envelope"></i> Message from ${escapeHtml(message.name)}`;
            document.getElementById('modalBody').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <strong><i class="fas fa-user"></i> Name:</strong><br>
                    ${escapeHtml(message.name)}
                </div>
                <div style="margin-bottom: 20px;">
                    <strong><i class="fas fa-envelope"></i> Email:</strong><br>
                    <a href="mailto:${escapeHtml(message.email)}" style="color: #60a5fa;">${escapeHtml(message.email)}</a>
                </div>
                <div style="margin-bottom: 20px;">
                    <strong><i class="fas fa-tag"></i> Subject:</strong><br>
                    ${escapeHtml(message.subject || 'No subject')}
                </div>
                <div style="margin-bottom: 20px;">
                    <strong><i class="fas fa-calendar"></i> Date:</strong><br>
                    ${message.date || 'Unknown date'}
                </div>
                <div style="margin-bottom: 20px;">
                    <strong><i class="fas fa-comment"></i> Message:</strong><br>
                    <div style="background: #0f172a; padding: 16px; border-radius: 12px; margin-top: 8px; white-space: pre-wrap;">${escapeHtml(message.message)}</div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button onclick="replyToMessage('${escapeHtml(message.email)}', '${escapeHtml(message.name)}')" style="background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;"><i class="fas fa-reply"></i> Reply via Email</button>
                    <button onclick="copyFullMessage(${message.id})" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;"><i class="fas fa-copy"></i> Copy Message</button>
                </div>
            `;
            
            document.getElementById('messageModal').classList.add('active');
        }

        function deleteMessage(id) {
            if (confirm('Are you sure you want to delete this message?')) {
                allMessages = allMessages.filter(m => m.id !== id);
                localStorage.setItem('contact_messages', JSON.stringify(allMessages));
                loadMessages();
                showToast('Message deleted successfully');
            }
        }

        function deleteAllMessages() {
            if (confirm('⚠️ WARNING: This will delete ALL messages. This cannot be undone. Are you sure?')) {
                allMessages = [];
                localStorage.removeItem('contact_messages');
                loadMessages();
                showToast('All messages deleted');
            }
        }

        function exportMessages() {
            if (allMessages.length === 0) {
                alert('No messages to export.');
                return;
            }
            
            const dataStr = JSON.stringify(allMessages, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `contact_messages_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Messages exported successfully');
        }

        function copyMessage(id) {
            const message = allMessages.find(m => m.id === id);
            if (!message) return;
            
            const textToCopy = `Name: ${message.name}\nEmail: ${message.email}\nSubject: ${message.subject || 'No subject'}\nDate: ${message.date}\n\nMessage:\n${message.message}`;
            navigator.clipboard.writeText(textToCopy);
            showToast('Message copied to clipboard');
        }

        function copyFullMessage(id) {
            const message = allMessages.find(m => m.id === id);
            if (!message) return;
            
            const textToCopy = `From: ${message.name} (${message.email})\nSubject: ${message.subject || 'No subject'}\nDate: ${message.date}\n\n${message.message}`;
            navigator.clipboard.writeText(textToCopy);
            showToast('Full message copied to clipboard');
            closeModal();
        }

        function replyToMessage(email, name) {
            window.location.href = `mailto:${email}?subject=Re: Your message from Saqib Afridi Blog`;
            closeModal();
        }

        function closeModal() {
            document.getElementById('messageModal').classList.remove('active');
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function truncateText(text, maxLength) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showToast(message) {
            // Create temporary toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 12px 24px;
                border-radius: 40px;
                font-size: 0.85rem;
                z-index: 2000;
                animation: fadeOut 3s forwards;
            `;
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Add animation style
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                0% { opacity: 1; transform: translateY(0); }
                70% { opacity: 1; }
                100% { opacity: 0; visibility: hidden; }
            }
        `;
        document.head.appendChild(style);

        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Close modal when clicking outside
        document.getElementById('messageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Load messages on page load
        loadMessages();
    </script>
</body>
</html>
