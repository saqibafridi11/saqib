<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saqib Afridi CMS | SHA-256 Secure</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1a; font-family: 'Inter', sans-serif; color: #e2e8f0; }
    .login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0f1a; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-card { background: #1e293b; padding: 40px; border-radius: 32px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
    .login-card h2 { margin-bottom: 12px; font-size: 1.8rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .login-card p { color: #94a3b8; margin-bottom: 20px; }
    .login-card input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; margin: 20px 0; font-size: 1rem; }
    .login-card input:focus { outline: none; border-color: #3b82f6; }
    .login-card button { width: 100%; padding: 14px; background: #3b82f6; border: none; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .login-card button:hover { background: #2563eb; transform: translateY(-2px); }
    .error-msg { color: #f87171; margin-bottom: 12px; display: none; font-size: 0.85rem; }
    
    .cms-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
    .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .admin-badge { font-size: 0.7rem; background: #10b981; color: white; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
    .view-blog-btn, .logout-btn { padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; border: none; margin-left: 12px; }
    .view-blog-btn { background: #1e293b; color: #60a5fa; border: 1px solid #3b82f6; }
    .view-blog-btn:hover { background: #3b82f6; color: white; }
    .logout-btn { background: #dc2626; color: white; }
    .logout-btn:hover { background: #b91c1c; }
    .form-card { background: #1e293b; border-radius: 24px; padding: 24px; margin-bottom: 32px; border: 1px solid #334155; }
    .form-card h3 { margin-bottom: 20px; font-size: 1.3rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #94a3b8; }
    input, select, textarea { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; font-family: inherit; font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 200px; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
    .btn-secondary { background: #334155; color: white; border: none; padding: 12px 24px; border-radius: 40px; cursor: pointer; }
    .form-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .edit-indicator { background: #f59e0b20; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: #f59e0b; display: none; }
    .posts-table { background: #1e293b; border-radius: 24px; padding: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 500; }
    .edit-post-btn, .delete-post-btn { background: none; border: none; cursor: pointer; padding: 6px 12px; border-radius: 8px; margin: 0 4px; }
    .edit-post-btn { color: #60a5fa; }
    .delete-post-btn { color: #f87171; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; }
    .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
    .category-card { background: #0f172a; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-container { background: #1e293b; border-radius: 24px; width: 90%; max-width: 500px; border: 1px solid #334155; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #334155; }
    .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #94a3b8; }
    .icon-preview { background: #0f172a; padding: 8px; border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>

<div id="loginScreen" class="login-container">
  <div class="login-card">
    <h2><i class="fas fa-shield-alt"></i> SHA-256 Secure CMS</h2>
    <p>Enter admin password</p>
    <div id="loginError" class="error-msg"></div>
    <input type="password" id="passwordInput" placeholder="Enter password" autofocus>
    <button id="loginBtn"><i class="fas fa-unlock-alt"></i> Verify</button>
  </div>
</div>

<div id="adminPanelRoot"></div>

<script>
(async function() {
  // ============================================
  // SHA-256 PASSWORD HASH
  // This is the hash of "peshawar.123"
  // To generate new hash: await sha256("your-password")
  // ============================================
  const PASSWORD_HASH = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";
  
  // Session keys
  const SESSION_KEY = 'cms_sha256_auth';
  const SESSION_TIMESTAMP = 'cms_auth_time';
  
  // SHA-256 hashing function
  async function sha256(message) {
    const encoder = new TextEncoder();
    const data = encoder.encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
  
  // Check if already authenticated
  function isAuthenticated() {
    const auth = sessionStorage.getItem(SESSION_KEY);
    const timestamp = sessionStorage.getItem(SESSION_TIMESTAMP);
    if (auth === 'true' && timestamp) {
      const expiry = parseInt(timestamp) + (12 * 60 * 60 * 1000); // 12 hours
      if (Date.now() < expiry) return true;
    }
    return false;
  }
  
  // Login function
  async function performLogin(password) {
    if (!password || password.trim() === '') {
      return { success: false, message: 'Password cannot be empty' };
    }
    
    const hashedInput = await sha256(password);
    
    if (hashedInput === PASSWORD_HASH) {
      sessionStorage.setItem(SESSION_KEY, 'true');
      sessionStorage.setItem(SESSION_TIMESTAMP, Date.now().toString());
      return { success: true };
    }
    
    return { success: false, message: 'Invalid password' };
  }
  
  function performLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_TIMESTAMP);
  }
  
  // ========== CMS FUNCTIONS ==========
  const STORAGE_KEY = 'bytelog_posts';
  const CATEGORIES_KEY = 'bytelog_categories';
  
  const MASTER_CATEGORIES = [
    { id: "programming", name: "Programming", icon: "fa-code", displayIcon: "💻" },
    { id: "hardware", name: "Hardware", icon: "fa-microchip", displayIcon: "🖥️" },
    { id: "security", name: "Security", icon: "fa-shield-haltered", displayIcon: "🔒" },
    { id: "computer-tricks", name: "Computer Tricks", icon: "fa-magic", displayIcon: "✨" },
    { id: "tutorial", name: "Tutorial", icon: "fa-book", displayIcon: "📚" }
  ];
  
  let categories = [];
  let posts = [];
  let editingPostId = null;
  
  function loadCategories() {
    const stored = localStorage.getItem(CATEGORIES_KEY);
    if (stored) {
      categories = JSON.parse(stored);
    } else {
      categories = JSON.parse(JSON.stringify(MASTER_CATEGORIES));
      saveCategories();
    }
  }
  
  function saveCategories() {
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
  }
  
  function loadPosts() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      posts = JSON.parse(stored);
    } else {
      posts = [
        { id: 1001, title: "USB Data Hidden by Virus – Complete Recovery Guide", excerpt: "Learn how to recover hidden data using CMD.", category: "computer-tricks", imgUrl: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=600", date: "Apr 22, 2026", readTime: "8 min read", content: "<p>Complete recovery guide...</p>" },
        { id: 1002, title: "Rust vs. Go: Performance face-off", excerpt: "Comparing memory safety and concurrency.", category: "programming", imgUrl: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600", date: "Apr 10, 2025", readTime: "8 min read", content: "<p>Rust vs Go performance...</p>" }
      ];
      savePosts();
    }
  }
  
  function savePosts() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }
  
  function getCategoryDisplayName(catId) {
    const cat = categories.find(c => c.id === catId);
    return cat ? (cat.displayIcon ? `${cat.displayIcon} ${cat.name}` : cat.name) : catId;
  }
  
  function renderCategoriesGrid() {
    const grid = document.getElementById("categoriesGrid");
    if (!grid) return;
    if (!categories.length) {
      grid.innerHTML = '<div class="empty-state">No categories.</div>';
      return;
    }
    grid.innerHTML = categories.map(cat => {
      const postCount = posts.filter(p => p.category === cat.id).length;
      return `
        <div class="category-card">
          <div class="category-info" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <div style="display:flex; align-items:center; gap:12px;">
              <div style="font-size:1.5rem;">${cat.displayIcon || `<i class="fas ${cat.icon}"></i>`}</div>
              <div><strong>${escapeHtml(cat.name)}</strong><br><small style="color:#64748b;">${cat.id}</small></div>
            </div>
            <span style="background:#1e293b; padding:4px 10px; border-radius:20px;">${postCount} posts</span>
            <div>
              <button class="edit-cat-btn" data-id="${cat.id}" style="background:none; border:none; color:#60a5fa; cursor:pointer;"><i class="fas fa-edit"></i></button>
              <button class="delete-cat-btn" data-id="${cat.id}" style="background:none; border:none; color:#f87171; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    
    document.querySelectorAll('.edit-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => openCategoryModal(btn.dataset.id));
    });
    document.querySelectorAll('.delete-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Delete category?')) {
          categories = categories.filter(c => c.id !== btn.dataset.id);
          saveCategories();
          renderCategoriesGrid();
          renderCategorySelect();
          renderPostsTable();
        }
      });
    });
  }
  
  function renderCategorySelect() {
    const select = document.getElementById("postCategory");
    if (select) {
      select.innerHTML = categories.map(cat => `<option value="${cat.id}">${cat.displayIcon || ''} ${cat.name}</option>`).join('');
    }
  }
  
  function renderPostsTable() {
    const tbody = document.getElementById("postsTableBody");
    if (!tbody) return;
    if (!posts.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No posts yet. Create your first article!</td></tr>';
      return;
    }
    tbody.innerHTML = posts.map(post => `
      <tr>
        <td>${post.id}</td>
        <td><strong>${escapeHtml(post.title)}</strong></td>
        <td>${escapeHtml(getCategoryDisplayName(post.category))}</td>
        <td>${post.date || 'Unknown'}</td>
        <td>
          <button class="edit-post-btn" data-id="${post.id}" style="background:none; border:none; color:#60a5fa; cursor:pointer;"><i class="fas fa-edit"></i> Edit</button>
          <button class="delete-post-btn" data-id="${post.id}" style="background:none; border:none; color:#f87171; cursor:pointer;"><i class="fas fa-trash"></i> Delete</button>
        </td>
      </tr>
    `).join('');
    
    document.querySelectorAll('.edit-post-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const post = posts.find(p => p.id === parseInt(btn.dataset.id));
        if (post) loadPostToForm(post);
      });
    });
    document.querySelectorAll('.delete-post-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Delete this post?')) {
          posts = posts.filter(p => p.id !== parseInt(btn.dataset.id));
          savePosts();
          renderPostsTable();
          renderCategoriesGrid();
          if (editingPostId === parseInt(btn.dataset.id)) clearForm();
        }
      });
    });
  }
  
  function loadPostToForm(post) {
    document.getElementById("postTitle").value = post.title;
    document.getElementById("postExcerpt").value = post.excerpt || "";
    document.getElementById("postCategory").value = post.category;
    document.getElementById("postImage").value = post.imgUrl || "";
    document.getElementById("postReadTime").value = post.readTime || "5 min read";
    document.getElementById("postContent").value = post.content || "";
    editingPostId = post.id;
    const indicator = document.getElementById("editIndicator");
    if (indicator) indicator.style.display = "inline-block";
    document.querySelector('.form-card h3').innerHTML = '<i class="fas fa-edit"></i> Edit Article';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  function clearForm() {
    document.getElementById("postTitle").value = "";
    document.getElementById("postExcerpt").value = "";
    document.getElementById("postCategory").value = categories[0]?.id || "";
    document.getElementById("postImage").value = "";
    document.getElementById("postReadTime").value = "5 min read";
    document.getElementById("postContent").value = "";
    editingPostId = null;
    const indicator = document.getElementById("editIndicator");
    if (indicator) indicator.style.display = "none";
    document.querySelector('.form-card h3').innerHTML = '<i class="fas fa-pen-fancy"></i> Create New Article';
  }
  
  function savePostFromForm(e) {
    e.preventDefault();
    
    const title = document.getElementById("postTitle").value.trim();
    const excerpt = document.getElementById("postExcerpt").value.trim();
    const category = document.getElementById("postCategory").value;
    const imgUrl = document.getElementById("postImage").value.trim();
    const readTime = document.getElementById("postReadTime").value.trim();
    const content = document.getElementById("postContent").value.trim();
    
    if (!title) return alert("Title is required!");
    if (!category) return alert("Category is required!");
    if (!content) return alert("Content is required!");
    
    const now = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    
    if (editingPostId) {
      const index = posts.findIndex(p => p.id === editingPostId);
      if (index !== -1) {
        posts[index] = { ...posts[index], title, excerpt: excerpt || title, category, imgUrl: imgUrl || posts[index].imgUrl, readTime: readTime || "5 min read", content, date: now };
        savePosts();
        alert("Post updated successfully!");
      }
      editingPostId = null;
      clearForm();
    } else {
      const newPost = { id: Date.now(), title, excerpt: excerpt || title, category, imgUrl: imgUrl || "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600", readTime: readTime || "5 min read", content, date: now };
      posts.unshift(newPost);
      savePosts();
      alert("Post published successfully!");
      clearForm();
    }
    
    renderPostsTable();
    renderCategoriesGrid();
  }
  
  function openCategoryModal(catId = null) {
    const modal = document.getElementById("categoryModal");
    if (!modal) return;
    document.getElementById("categoryModalTitle").innerHTML = catId ? "Edit Category" : "Add Category";
    document.getElementById("categoryId").disabled = !!catId;
    
    if (catId) {
      const cat = categories.find(c => c.id === catId);
      if (cat) {
        document.getElementById("categoryId").value = cat.id;
        document.getElementById("categoryName").value = cat.name;
        document.getElementById("categoryIcon").value = cat.icon || "fa-folder";
        document.getElementById("categoryDisplayIcon").value = cat.displayIcon || "";
        document.getElementById("editingCategoryId").value = cat.id;
        const preview = document.getElementById("iconPreview");
        if (preview) preview.innerHTML = `<i class="fas ${cat.icon || 'fa-folder'}"></i> ${cat.icon || 'fa-folder'}`;
      }
    } else {
      document.getElementById("categoryForm").reset();
      document.getElementById("categoryId").disabled = false;
      document.getElementById("categoryIcon").value = "fa-folder";
      document.getElementById("editingCategoryId").value = "";
      const preview = document.getElementById("iconPreview");
      if (preview) preview.innerHTML = '<i class="fas fa-folder"></i> fa-folder';
    }
    modal.classList.add("active");
  }
  
  function closeCategoryModal() {
    document.getElementById("categoryModal").classList.remove("active");
  }
  
  function handleCategorySubmit(e) {
    e.preventDefault();
    let id = document.getElementById("categoryId").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
    const name = document.getElementById("categoryName").value.trim();
    let icon = document.getElementById("categoryIcon").value.trim();
    const displayIcon = document.getElementById("categoryDisplayIcon").value.trim();
    const editingId = document.getElementById("editingCategoryId").value;
    
    if (!id || !name) return alert("ID and Name required!");
    if (!icon) icon = "fa-folder";
    
    if (editingId) {
      const index = categories.findIndex(c => c.id === editingId);
      if (index !== -1) {
        const oldId = categories[index].id;
        categories[index] = { ...categories[index], id, name, icon, displayIcon };
        if (oldId !== id) {
          posts = posts.map(p => p.category === oldId ? { ...p, category: id } : p);
          savePosts();
        }
        saveCategories();
      }
    } else {
      if (categories.some(c => c.id === id)) return alert("Category exists!");
      categories.push({ id, name, icon, displayIcon });
      saveCategories();
    }
    
    renderCategoriesGrid();
    renderCategorySelect();
    renderPostsTable();
    closeCategoryModal();
    alert("Category saved!");
  }
  
  function buildAdminPanel() {
    return `
      <div class="cms-container">
        <div class="header">
          <div class="logo"><i class="fas fa-shield-alt"></i> SHA-256 Secure CMS <span class="admin-badge">● Protected</span></div>
          <div>
            <button class="view-blog-btn" id="viewBlogBtn"><i class="fas fa-external-link-alt"></i> View Blog</button>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
          </div>
        </div>
        
        <div class="form-card category-manager">
          <h3><i class="fas fa-tags"></i> Categories</h3>
          <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <p style="color:#94a3b8;">Manage your blog categories</p>
            <button class="add-category-btn" id="addCategoryBtn" style="background:#10b981; border:none; padding:8px 20px; border-radius:40px; color:white; cursor:pointer;"><i class="fas fa-plus"></i> Add Category</button>
          </div>
          <div id="categoriesGrid" class="categories-grid">Loading...</div>
        </div>
        
        <div class="form-card">
          <h3><i class="fas fa-pen-fancy"></i> Create New Article</h3>
          <form id="postForm">
            <div class="form-group"><label>Title *</label><input type="text" id="postTitle" required></div>
            <div class="form-group"><label>Excerpt</label><textarea id="postExcerpt" rows="2"></textarea></div>
            <div class="form-group"><label>Category *</label><select id="postCategory" required></select></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="postImage" placeholder="https://..."></div>
            <div class="form-group"><label>Read Time</label><input type="text" id="postReadTime" value="5 min read"></div>
            <div class="form-group"><label>Content *</label><textarea id="postContent" rows="12"></textarea></div>
            <div class="form-actions">
              <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Publish Post</button>
              <button type="button" class="btn-secondary" id="clearFormBtn"><i class="fas fa-eraser"></i> Clear</button>
              <span id="editIndicator" class="edit-indicator"><i class="fas fa-edit"></i> Editing Mode</span>
            </div>
          </form>
        </div>
        
        <div class="posts-table">
          <h3><i class="fas fa-list"></i> All Articles (${posts.length})</h3>
          <table style="width:100%">
            <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="postsTableBody"></tbody>
          </table>
        </div>
      </div>
      
      <div id="categoryModal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <h2 id="categoryModalTitle">Add Category</h2>
            <button class="modal-close" id="closeCategoryModalBtn">&times;</button>
          </div>
          <div class="modal-body">
            <form id="categoryForm">
              <div class="form-group"><label>Category ID</label><input type="text" id="categoryId" required></div>
              <div class="form-group"><label>Display Name</label><input type="text" id="categoryName" required></div>
              <div class="form-group"><label>Icon Class</label><input type="text" id="categoryIcon" value="fa-folder"><div class="icon-preview" id="iconPreview"><i class="fas fa-folder"></i> fa-folder</div></div>
              <div class="form-group"><label>Display Emoji</label><input type="text" id="categoryDisplayIcon"></div>
              <input type="hidden" id="editingCategoryId">
              <div class="form-actions"><button type="submit" class="btn-primary">Save</button><button type="button" class="btn-secondary" id="cancelCategoryBtn">Cancel</button></div>
            </form>
          </div>
        </div>
      </div>
    `;
  }
  
  function attachEvents() {
    document.getElementById("viewBlogBtn")?.addEventListener("click", () => window.open('index.html', '_blank'));
    document.getElementById("logoutBtn")?.addEventListener("click", () => {
      performLogout();
      document.getElementById('adminPanelRoot').innerHTML = '';
      document.getElementById('adminPanelRoot').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('passwordInput').value = '';
    });
    document.getElementById("postForm")?.addEventListener("submit", savePostFromForm);
    document.getElementById("clearFormBtn")?.addEventListener("click", clearForm);
    document.getElementById("addCategoryBtn")?.addEventListener("click", () => openCategoryModal(null));
    document.getElementById("cancelCategoryBtn")?.addEventListener("click", closeCategoryModal);
    document.getElementById("closeCategoryModalBtn")?.addEventListener("click", closeCategoryModal);
    document.getElementById("categoryForm")?.addEventListener("submit", handleCategorySubmit);
    document.getElementById("categoryIcon")?.addEventListener("input", () => {
      const icon = document.getElementById("categoryIcon").value || "fa-folder";
      document.getElementById("iconPreview").innerHTML = `<i class="fas ${icon}"></i> ${icon}`;
    });
  }
  
  function showAdminPanel() {
    if (!isAuthenticated()) {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPanelRoot').style.display = 'none';
      return;
    }
    
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanelRoot').innerHTML = buildAdminPanel();
    document.getElementById('adminPanelRoot').style.display = 'block';
    
    loadCategories();
    loadPosts();
    renderCategoriesGrid();
    renderCategorySelect();
    renderPostsTable();
    attachEvents();
  }
  
  // Initialize login
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const password = document.getElementById('passwordInput').value;
    const errorDiv = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    errorDiv.style.display = 'none';
    
    const result = await performLogin(password);
    
    if (result.success) {
      showAdminPanel();
    } else {
      errorDiv.innerText = result.message;
      errorDiv.style.display = 'block';
      document.getElementById('passwordInput').value = '';
    }
    
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-unlock-alt"></i> Verify';
  });
  
  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  
  if (isAuthenticated()) showAdminPanel();
})();
</script>
</body>
</html>
