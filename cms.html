<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Login - Saqib Afridi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1a;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #334155;
            width: 350px;
        }
        .login-box h2 { color: white; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 CMS Login</h2>
        <input type="password" id="password" placeholder="Enter password" autofocus>
        <button onclick="checkPassword()">Login</button>
        <div id="error" class="error"></div>
    </div>

    <script>
        // CORRECT SHA-256 hash for "peshawar.123"
        const CORRECT_HASH = "617b3de06e754dad66e4b708744d20acc57d95fd72b2d4cbc0e12a16cbaf5c86";
        
        async function checkPassword() {
            const pwd = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            // Hash the entered password
            const encoder = new TextEncoder();
            const data = encoder.encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            if (hashHex === CORRECT_HASH) {
                // Password correct
                sessionStorage.setItem('cms_authenticated', 'true');
                sessionStorage.setItem('cms_auth_time', Date.now());
                window.location.href = 'cms_dashboard.html';
            } else {
                errorDiv.textContent = '❌ Invalid password!';
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
        
        // Enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
