<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard - Saqib Afridi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2e8f0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #334155;
        }

        .header h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .logout {
            background: #ef4444;
        }

        .logout:hover {
            background: #dc2626;
        }

        .view-blog {
            background: #10b981;
        }

        .view-blog:hover {
            background: #059669;
        }

        /* Form Card */
        .form-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }

        .form-card h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #94a3b8;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
        }

        /* Posts Grid */
        .posts-section h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #60a5fa;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            transition: all 0.2s;
        }

        .post-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .post-meta {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .post-excerpt {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .post-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn {
            background: #f59e0b;
            padding: 6px 12px;
            font-size: 12px;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Success/Error Messages */
        .message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #10b981;
        }

        .message.error {
            background: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .posts-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📝 Saqib Afridi CMS Dashboard</h2>
            <div class="header-buttons">
                <button class="view-blog" onclick="viewBlog()">🌐 View Blog</button>
                <button class="logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Create/Edit Post Form -->
        <div class="form-card">
            <h3 id="formTitle">✏️ Create New Post</h3>
            <div class="form-group">
                <label>Post Title *</label>
                <input type="text" id="postTitle" placeholder="Enter post title">
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select id="postCategory">
                    <option value="programming">💻 Programming</option>
                    <option value="hardware">🖥️ Hardware</option>
                    <option value="security">🔒 Security</option>
                    <option value="computer-tricks">🪄 Computer Tricks</option>
                    <option value="tutorial">📚 Tutorial</option>
                </select>
            </div>
            <div class="form-group">
                <label>Excerpt (Short summary)</label>
                <textarea id="postExcerpt" rows="2" placeholder="Brief summary of your post..."></textarea>
            </div>
            <div class="form-group">
                <label>Full Content * (HTML supported)</label>
                <textarea id="postContent" rows="10" placeholder="Write your article content here. You can use HTML tags for formatting..."></textarea>
            </div>
            <div class="form-group">
                <label>Featured Image URL</label>
                <input type="text" id="postImage" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
                <label>Read Time</label>
                <input type="text" id="postReadTime" placeholder="5 min read" value="5 min read">
            </div>
            <button id="saveBtn" onclick="savePost()">📤 Publish Post</button>
            <button id="cancelBtn" onclick="cancelEdit()" style="background: #64748b; margin-left: 10px; display: none;">❌ Cancel Edit</button>
        </div>

        <!-- All Posts Section -->
        <div class="posts-section">
            <h3>📚 All Articles</h3>
            <div id="postsList" class="posts-grid"></div>
        </div>
    </div>

    <script>
        // Storage keys
        const STORAGE_KEY = 'bytelog_posts';
        let editingPostId = null;

        // Get all posts
        function getPosts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                return JSON.parse(stored);
            }
            // Default posts
            const defaultPosts = [
                {
                    id: 1001,
                    title: "USB Data Hidden by Virus – Complete Recovery Guide",
                    category: "computer-tricks",
                    excerpt: "Virus made your USB files disappear? Learn how to recover hidden data using CMD, attrib command, and professional tools.",
                    content: "<h2>Complete Recovery Guide</h2><p>Step-by-step instructions to recover your hidden files...</p>",
                    imgUrl: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=600",
                    date: "Apr 22, 2026",
                    readTime: "8 min read"
                },
                {
                    id: 1002,
                    title: "Rust vs. Go: Performance face-off in 2025",
                    category: "programming",
                    excerpt: "Comparing memory safety, concurrency models and real-world benchmarks.",
                    content: "<p>Rust and Go comparison...</p>",
                    imgUrl: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600",
                    date: "Apr 10, 2025",
                    readTime: "8 min read"
                },
                {
                    id: 1003,
                    title: "Inside NVIDIA's Blackwell Architecture",
                    category: "hardware",
                    excerpt: "How next-gen GPUs are pushing the limits of AI training.",
                    content: "<p>NVIDIA's Blackwell architecture...</p>",
                    imgUrl: "https://images.unsplash.com/photo-1591489378430-ef2e537ee8b4?w=600",
                    date: "Apr 5, 2025",
                    readTime: "6 min read"
                }
            ];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultPosts));
            return defaultPosts;
        }

        // Save posts
        function savePosts(posts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
            // Trigger storage event for index.html
            window.dispatchEvent(new Event('storage'));
        }

        // Display posts
        function displayPosts() {
            const posts = getPosts();
            const container = document.getElementById('postsList');
            
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i>📭</i>
                        <p>No posts yet. Create your first article!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-meta">
                        <span>📅 ${post.date || 'Just now'}</span>
                        <span>📁 ${post.category}</span>
                        <span>⏱️ ${post.readTime || '5 min read'}</span>
                    </div>
                    <div class="post-excerpt">${escapeHtml(post.excerpt?.substring(0, 100) || '')}...</div>
                    <div class="post-actions">
                        <button class="edit-btn" onclick="editPost(${post.id})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deletePost(${post.id})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Save or update post
        function savePost() {
            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value;
            const excerpt = document.getElementById('postExcerpt').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const imgUrl = document.getElementById('postImage').value.trim();
            const readTime = document.getElementById('postReadTime').value.trim();

            if (!title || !category || !content) {
                showMessage('Please fill in Title, Category, and Content', 'error');
                return;
            }

            const posts = getPosts();
            const now = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

            if (editingPostId) {
                // Update existing post
                const index = posts.findIndex(p => p.id === editingPostId);
                if (index !== -1) {
                    posts[index] = {
                        ...posts[index],
                        title,
                        category,
                        excerpt,
                        content,
                        imgUrl: imgUrl || posts[index].imgUrl,
                        readTime: readTime || '5 min read',
                        date: now
                    };
                    savePosts(posts);
                    showMessage('✅ Post updated successfully!', 'success');
                }
                cancelEdit();
            } else {
                // Create new post
                const newPost = {
                    id: Date.now(),
                    title,
                    category,
                    excerpt,
                    content,
                    imgUrl: imgUrl || 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600',
                    date: now,
                    readTime: readTime || '5 min read'
                };
                posts.unshift(newPost);
                savePosts(posts);
                showMessage('✅ Post published successfully!', 'success');
                clearForm();
            }

            displayPosts();
        }

        // Edit post
        function editPost(id) {
            const posts = getPosts();
            const post = posts.find(p => p.id === id);
            
            if (post) {
                editingPostId = post.id;
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postCategory').value = post.category;
                document.getElementById('postExcerpt').value = post.excerpt || '';
                document.getElementById('postContent').value = post.content;
                document.getElementById('postImage').value = post.imgUrl || '';
                document.getElementById('postReadTime').value = post.readTime || '5 min read';
                
                document.getElementById('formTitle').innerHTML = '✏️ Edit Post';
                document.getElementById('saveBtn').innerHTML = '💾 Update Post';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Cancel edit
        function cancelEdit() {
            editingPostId = null;
            clearForm();
            document.getElementById('formTitle').innerHTML = '✏️ Create New Post';
            document.getElementById('saveBtn').innerHTML = '📤 Publish Post';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Delete post
        function deletePost(id) {
            if (confirm('Are you sure you want to delete this post? This cannot be undone.')) {
                const posts = getPosts();
                const newPosts = posts.filter(p => p.id !== id);
                savePosts(newPosts);
                displayPosts();
                showMessage('🗑️ Post deleted successfully', 'success');
                
                if (editingPostId === id) {
                    cancelEdit();
                }
            }
        }

        // Clear form
        function clearForm() {
            document.getElementById('postTitle').value = '';
            document.getElementById('postCategory').value = 'programming';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            document.getElementById('postReadTime').value = '5 min read';
        }

        // View blog
        function viewBlog() {
            window.open('index.html', '_blank');
        }

        // Logout
        function logout() {
            sessionStorage.removeItem('cms_authenticated');
            sessionStorage.removeItem('cms_auth_time');
            window.location.href = 'cms.html';
        }

        // Show message
        function showMessage(msg, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = msg;
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Check authentication
        function checkAuth() {
            const isAuth = sessionStorage.getItem('cms_authenticated');
            const authTime = sessionStorage.getItem('cms_auth_time');
            
            if (isAuth !== 'true') {
                window.location.href = 'cms.html';
                return false;
            }
            
            if (authTime && (Date.now() - parseInt(authTime) > 86400000)) {
                // Session expired after 24 hours
                logout();
                return false;
            }
            
            return true;
        }

        // Initialize
        if (checkAuth()) {
            displayPosts();
        }
    </script>
</body>
</html>
